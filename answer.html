<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>友安製作所</title>
        <link rel="stylesheet" href="css/ress.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/answer.css" />
        <script defer src="js/answer.js"></script>
    </head>
    <body>
        <div class="mock_wrap">
            <div class="mock_bg"></div>
        </div>

        <div class="body_wrap">
            <header>
                <h1>
                    <a href="https://colorstw.com/">
                        <img src="./images/colorsLogo.svg" alt="colors Taiwan" />
                    </a>
                </h1>
                <nav>
                    <ul>
                        <li>
                            <a href="#">
                                <span>CATEGORY</span>
                                商品種類
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <span>FEATURE</span>
                                特徴
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <span>SERVICE</span>
                                服務項目
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="icon_wrap">
                    <img src="./images/icon_search.png" alt="" />
                    <img src="./images/icon_shop.png" alt="" />
                </div>
            </header>
            <main>
                <div class="head_title">
                    <a href="index.html">
                        <img src="images/icon_arrow_left.png" alt="" />
                    </a>
                    <h1>診断ページ</h1>
                    <span></span>
                </div>
                <div class="progress_wrap">
                    <p>Q <span id="minNum">1</span>/<span id="maxNum">3</span></p>
                    <span class="progress_bar"></span>
                </div>
                <div class="question_wrap">
                    <h2>おうちで一番大切にしたいことは?</h2>
                    <div class="question_item" data-score="a">
                        <div class="question_img">
                            <img src="images/question_img01.png" alt="" />
                        </div>
                        <div class="question_text">
                            <p>毎日の料理を楽しみたい</p>
                        </div>
                    </div>
                    <div class="question_item" data-score="b">
                        <div class="question_img">
                            <img src="images/question_img01.png" alt="" />
                        </div>
                        <div class="question_text">
                            <p>おしゃれな空間で過ごしたい</p>
                        </div>
                    </div>
                    <div class="question_item" data-score="c">
                        <div class="question_img">
                            <img src="images/question_img01.png" alt="" />
                        </div>
                        <div class="question_text">
                            <p>自分らしく部屋作りをしたい</p>
                        </div>
                    </div>
                </div>
                <div class="megane_gorira">
                    <img src="images/meganeGorira_red.png" alt="" />
                </div>
            </main>
        </div>
        <div class="mock_bg"></div>
    </body>
</html>
