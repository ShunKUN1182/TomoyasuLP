<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>友安製作所</title>
        <link rel="stylesheet" href="css/ress.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/diagnosis.css" />
    </head>
    <body>
        <div class="body_wrap">
            <header>
                <h1>
                    <a href="https://colorstw.com/">
                        <img src="./images/colorsLogo.svg" alt="colors Taiwan" />
                    </a>
                </h1>
                <nav>
                    <ul>
                        <li>
                            <a href="#">
                                <span>CATEGORY</span>
                                商品種類
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <span>FEATURE</span>
                                特徴
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <span>SERVICE</span>
                                服務項目
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="icon_wrap">
                    <img src="./images/icon_search.png" alt="" />
                    <img src="./images/icon_shop.png" alt="" />
                </div>
            </header>
            <main>
                <div class="bg_wrap">
                    <p>
                        家具診断<br />
                        やってみて
                    </p>
                    <img src="images/gorira_Sit.png" alt="" />
                    <span class="bg background01"></span>
                    <span class="bg background02"></span>
                </div>
                <div class="content">
                    <h2>あなたに合う家具を見つけよう</h2>
                    <div class="note_wrap">
                        <div class="note_item">
                            <span>
                                <img src="images/note_icon01.png" alt="" />
                            </span>
                            <p>約1分で完了</p>
                        </div>
                        <div class="note_item">
                            <span>
                                <img src="images/note_icon02.png" alt="" />
                            </span>
                            <p>質問は三問だけ</p>
                        </div>
                        <div class="note_item">
                            <span>
                                <img src="images/note_icon03.png" alt="" />
                            </span>
                            <p>
                                あなたに合う<br />
                                家具を紹介
                            </p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div class="mock_bg"></div>
    </body>
</html>
