<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>友安製作所</title>
        <link rel="stylesheet" href="css/ress.css" />
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet" href="css/index.css" />
    </head>
    <body>
        <div class="body_wrap">
            <header>
                <h1>
                    <a href="https://colorstw.com/">
                        <img src="./images/colorsLogo.svg" alt="colors Taiwan" />
                    </a>
                </h1>
                <nav>
                    <ul>
                        <li>
                            <a href="#">
                                <span>CATEGORY</span>
                                商品種類
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <span>FEATURE</span>
                                特徴
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <span>SERVICE</span>
                                服務項目
                            </a>
                        </li>
                    </ul>
                </nav>
                <div class="icon_wrap">
                    <img src="./images/icon_search.png" alt="" />
                    <img src="./images/icon_shop.png" alt="" />
                </div>
            </header>
            <main>
                <div class="mainVisual">
                    <h2>Colors 台湾</h2>
                    <a href="#">
                        <img src="images/GoriraHead.png" alt="" id="goriraHeadImg" />
                        <div>詳細はこちら</div>
                    </a>
                    <div class="object_light">
                        <img src="images/object_light.png" alt="" />
                    </div>
                    <div class="object_fork">
                        <img src="images/object_fork.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_01">
                        <img src="images/ogject_tile_01.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_02">
                        <img src="images/object_tile_02.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_03">
                        <img src="images/object_tile_03.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_04">
                        <img src="images/object_tile_04.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_05">
                        <img src="images/object_tile_05.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_06">
                        <img src="images/object_tile_06.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_07">
                        <img src="images/object_tile_07.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_08">
                        <img src="images/object_tile_08.png" alt="" />
                    </div>
                    <div class="object_tile object_tile_09">
                        <img src="images/object_tile_09.png" alt="" />
                    </div>
                </div>
                <div class="pickup_banner">
                    <h2>PICK UP</h2>
                </div>
                <div class="pickup_wrap">
                    <div class="pickup_item">
                        <img src="images/pickup_icon_tile.png" alt="" />
                        <h3>DIYスタイル</h3>
                    </div>
                    <div class="pickup_item">
                        <img src="images/pickup_icon_aras.png" alt="" />
                        <h3>ARAS</h3>
                    </div>
                    <div class="pickup_item">
                        <img src="images/pickup_icon_moku.png" alt="" />
                        <h3>MOKU</h3>
                    </div>
                </div>
            </main>
        </div>
        <div class="mock_bg"></div>
    </body>
</html>
